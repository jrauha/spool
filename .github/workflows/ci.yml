name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spool
          POSTGRES_PASSWORD: spool
          POSTGRES_DB: spool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spool -d spool_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPOOL_TEST_DATABASE_URL: postgres://spool:spool@localhost:5432/spool_test?sslmode=disable

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...
