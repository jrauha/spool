x-spool-app: &spool-app
  build: .
  restart: unless-stopped
  environment:
    SPOOL_DATABASE_URL: postgres://spool:spool@postgres:5432/spool?sslmode=disable
    SPOOL_HOME: /var/lib/spool
    SPOOL_SETUP_TOKEN: ${SPOOL_SETUP_TOKEN:-}
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - spool-home-data:/var/lib/spool

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spool
      POSTGRES_PASSWORD: spool
      POSTGRES_DB: spool
    ports:
      - "5432:5432"
    volumes:
      - spool-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spool -d spool"]
      interval: 10s
      timeout: 5s
      retries: 5

  spool-migrate:
    <<: *spool-app
    command: ["migrate"]
    restart: "no"

  spool-server:
    <<: *spool-app
    command: ["server"]
    depends_on:
      spool-migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  spool-worker:
    <<: *spool-app
    command: ["worker"]
    depends_on:
      spool-migrate:
        condition: service_completed_successfully

  spool-scheduler:
    <<: *spool-app
    command: ["scheduler"]
    depends_on:
      spool-migrate:
        condition: service_completed_successfully

volumes:
  spool-postgres-data:
  spool-home-data:
